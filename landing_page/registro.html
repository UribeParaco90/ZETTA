<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Crea una cuenta de acudiente en ZETTA.">
    <title>Crear cuenta de acudiente · ZETTA</title>
    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
    <script src="js/register.js" defer></script>
  </head>
  <body class="login-page">
    <header class="login-topbar">
      <a class="navbar-brand fw-bold grad" href="index.html" aria-label="ZETTA, ir al inicio">ZETTA</a>
      <a class="back-link" href="login.html">Ya tengo cuenta</a>
    </header>
    <main class="login-layout register-layout">
      <section class="login-card glass" aria-labelledby="register-title">
        <div class="login-heading">
          <span class="login-mark" aria-hidden="true">Z</span>
          <p class="eyebrow mb-2">PORTAL ACADÉMICO</p>
          <h1 id="register-title" class="h2 fw-bold mb-2">Crear cuenta</h1>
          <p class="text-muted mb-0">El registro público crea exclusivamente cuentas de Acudiente.</p>
        </div>
        <form id="registerForm" class="login-form" novalidate>
          <div>
            <label class="form-label" for="institutionId">Institución</label>
            <select class="form-select field" id="institutionId" name="institutionId" required>
              <option value="">Cargando instituciones…</option>
            </select>
          </div>
          <div>
            <label class="form-label" for="documento">Documento</label>
            <input class="form-control field" id="documento" name="documento" type="text" maxlength="30" autocomplete="off" required>
          </div>
          <div>
            <label class="form-label" for="nombre">Nombres</label>
            <input class="form-control field" id="nombre" name="nombre" type="text" maxlength="80" autocomplete="given-name" required>
          </div>
          <div>
            <label class="form-label" for="apellido">Apellidos</label>
            <input class="form-control field" id="apellido" name="apellido" type="text" maxlength="80" autocomplete="family-name" required>
          </div>
          <div>
            <label class="form-label" for="email">Correo electrónico</label>
            <input class="form-control field" id="email" name="email" type="email" maxlength="150" autocomplete="email" required>
          </div>
          <div>
            <label class="form-label" for="password">Contraseña</label>
            <input class="form-control field" id="password" name="password" type="password" minlength="8" maxlength="200" autocomplete="new-password" required>
            <small class="form-text text-muted">Usa al menos 8 caracteres.</small>
          </div>
          <div>
            <label class="form-label" for="confirmPassword">Confirmar contraseña</label>
            <input class="form-control field" id="confirmPassword" name="confirmPassword" type="password" minlength="8" maxlength="200" autocomplete="new-password" required>
          </div>
          <p class="form-feedback" id="registerFeedback" role="status" aria-live="polite"></p>
          <button class="btn btn-zetta btn-lg w-100 login-submit" type="submit" disabled>Crear cuenta de acudiente</button>
        </form>
        <aside class="demo-note">
          <span class="demo-indicator" aria-hidden="true"></span>
          <div>
            <b>Cuenta en Neon</b>
            <p class="mb-0">El servidor asigna el rol Acudiente; el formulario no permite elegir ni crear otros roles.</p>
          </div>
        </aside>
      </section>
    </main>
    <footer class="login-footer">
      <span><b class="grad">ZETTA</b> · Gestión académica</span>
      <span>© 2026 ZETTA</span>
    </footer>
  </body>
</html>
